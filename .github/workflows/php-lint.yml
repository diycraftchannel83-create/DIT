name: PHP Syntax Check

on:
  push:
    branches: [main]
    paths:
      - 'admin/**/*.php'
      - 'portal/**/*.php'
      - 'backend/**/*.php'
      - 'website/**/*.php'
      - '.github/workflows/php-lint.yml'
  pull_request:
    paths:
      - 'admin/**/*.php'
      - 'portal/**/*.php'
      - 'backend/**/*.php'
      - 'website/**/*.php'
  workflow_dispatch:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Check PHP syntax
        run: |
          find . -type f -name '*.php' \
            -not -path './.git/*' \
            -not -path './vendor/*' \
            -print0 | xargs -0 -n1 php -l
