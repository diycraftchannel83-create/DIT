name: Deploy Laravel Preview to ByetHost

on:
  workflow_dispatch:
    inputs:
      confirm_staging_deploy:
        description: "I confirm deployment ONLY to /htdocs/website/laravel-preview/ (not the live website root)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    if: inputs.confirm_staging_deploy == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository source
        uses: actions/checkout@v4

      - name: Setup PHP 8.4 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: ctype, curl, dom, fileinfo, filter, hash, mbstring, openssl, pcre, pdo, session, tokenizer, xml, pdo_mysql, zip
          coverage: none

      - name: Build fresh Laravel 13 application
        run: |
          set -euo pipefail
          composer create-project laravel/laravel:^13.0 laravel-preview --no-interaction --prefer-dist
          # Overlay the reviewed, version-controlled Laravel integration source.
          cp -a laravel-app/app/. laravel-preview/app/
          # Overlay the reviewed web routes for the preview.
          mkdir -p laravel-preview/routes
          cp -a laravel-app/routes/. laravel-preview/routes/
          cd laravel-preview
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
          cp .env.example .env
          php artisan key:generate --force
          sed -i 's/^APP_ENV=.*/APP_ENV=staging/' .env
          sed -i 's/^APP_DEBUG=.*/APP_DEBUG=false/' .env
          sed -i 's#^APP_URL=.*#APP_URL=https://siakadstitdit.byethost24.com/laravel-preview/public#' .env
          sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=file/' .env
          sed -i 's/^CACHE_STORE=.*/CACHE_STORE=file/' .env
          sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=/' .env
          cat >> .env <<'ENVVARS'

          # Existing SIAKAD database bridge (intentionally unconfigured in source).
          ACADEMIC_DB_HOST=
          ACADEMIC_DB_PORT=3306
          ACADEMIC_DB_DATABASE=
          ACADEMIC_DB_USERNAME=
          ACADEMIC_DB_PASSWORD=
          ACADEMIC_DB_CHARSET=utf8mb4
          ACADEMIC_DB_COLLATION=utf8mb4_unicode_ci
          ACADEMIC_MAINTENANCE_TOKEN=
          ENVVARS
          php artisan config:clear
          php artisan route:list
          php artisan route:list --path=academic-inspect-check-2026 --except-vendor | grep -q academic-inspect-check-2026
          php artisan route:list --path=route-probe-2026 --except-vendor | grep -q route-probe-2026
          php -l routes/web.php
          test -d storage/framework
          test -d bootstrap/cache

      - name: Protect Laravel project files outside public directory
        run: |
          cat > laravel-preview/.htaccess <<'HTACCESS'
          Options -Indexes
          <IfModule mod_authz_core.c>
              Require all denied
          </IfModule>
          <IfModule !mod_authz_core.c>
              Order allow,deny
              Deny from all
          </IfModule>
          HTACCESS
          cat >> laravel-preview/public/.htaccess <<'HTACCESS'

          <IfModule mod_authz_core.c>
              Require all granted
          </IfModule>
          <IfModule !mod_authz_core.c>
              Order allow,deny
              Allow from all
          </IfModule>
          HTACCESS

      - name: Verify Laravel build and prepare minimal route patch
        run: |
          set -euo pipefail
          test -f laravel-preview/public/index.php
          test -f laravel-preview/vendor/autoload.php
          php -l laravel-preview/public/index.php
          php -l laravel-preview/routes/web.php
          cd laravel-preview
          php artisan route:list --path=academic-inspect-check-2026 --except-vendor | grep -q academic-inspect-check-2026
          cd ..
          mkdir -p dist/patch
          cp laravel-preview/routes/web.php dist/patch/web.php
          sha256sum dist/patch/web.php

      - name: Upload only the reviewed route file (no ZIP, no deletes)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BYETHOST_FTP_SERVER }}
          username: ${{ secrets.BYETHOST_FTP_USERNAME }}
          password: ${{ secrets.BYETHOST_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /htdocs/website/laravel-preview/routes/
          local-dir: ./dist/patch/
          dangerous-clean-slate: false

      - name: Prepare one-shot public PHP diagnostic
        run: |
          set -euo pipefail
          mkdir -p dist/public-probe
          cat > dist/public-probe/public-php-probe-20261112.php <<'PHP'
          <?php
          declare(strict_types=1);
          header('Content-Type: text/plain; charset=UTF-8');
          header('Cache-Control: no-store, no-cache, must-revalidate, max-age=0');
          echo "PUBLIC_PHP_EXECUTION_OK\\n";
          if (@unlink(__FILE__)) {
              echo "PROBE_SELF_DELETE_OK\\n";
          } else {
              echo "PROBE_SELF_DELETE_FAILED\\n";
          }
          PHP
          php -l dist/public-probe/public-php-probe-20261112.php

      - name: Upload one-shot diagnostic to Laravel public directory
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BYETHOST_FTP_SERVER }}
          username: ${{ secrets.BYETHOST_FTP_USERNAME }}
          password: ${{ secrets.BYETHOST_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /htdocs/website/laravel-preview/public/
          local-dir: ./dist/public-probe/
          dangerous-clean-slate: false

      - name: Prepare harmless static public-directory diagnostic
        run: |
          set -euo pipefail
          mkdir -p dist/public-static-probe
          printf '%s\\n' 'PUBLIC_STATIC_FILE_REACHED_OK' > dist/public-static-probe/public-static-probe-20261112.txt

      - name: Upload static diagnostic to Laravel public directory
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BYETHOST_FTP_SERVER }}
          username: ${{ secrets.BYETHOST_FTP_USERNAME }}
          password: ${{ secrets.BYETHOST_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /htdocs/website/laravel-preview/public/
          local-dir: ./dist/public-static-probe/
          dangerous-clean-slate: false

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "## Laravel preview deployment"
            echo "- Target: /htdocs/website/laravel-preview/"
            echo "- Transfer method: direct FTP of the reviewed routes/web.php only"
            echo "- No ZIP, manual extraction, remote deletion, or public PHP extractor is used"
            echo "- Existing .env, application files, vendor files, and production website are untouched"
            echo "- Production website root and database were not changed"
          } >> "$GITHUB_STEP_SUMMARY"
