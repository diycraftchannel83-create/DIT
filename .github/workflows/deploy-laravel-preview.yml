name: Deploy Laravel Preview to ByetHost

on:
  workflow_dispatch:
    inputs:
      confirm_staging_deploy:
        description: "I confirm deployment ONLY to /htdocs/laravel-preview/ (not the live website root)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    if: inputs.confirm_staging_deploy == true
    runs-on: ubuntu-latest
    steps:
      - name: Setup PHP 8.4 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: ctype, curl, dom, fileinfo, filter, hash, mbstring, openssl, pcre, pdo, session, tokenizer, xml, pdo_mysql, zip
          coverage: none

      - name: Build fresh Laravel 13 application
        run: |
          set -euo pipefail
          composer create-project laravel/laravel:^13.0 laravel-preview --no-interaction --prefer-dist
          cd laravel-preview
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
          cp .env.example .env
          php artisan key:generate --force
          sed -i 's/^APP_ENV=.*/APP_ENV=staging/' .env
          sed -i 's/^APP_DEBUG=.*/APP_DEBUG=false/' .env
          sed -i 's#^APP_URL=.*#APP_URL=https://siakadstitdit.byethost24.com/laravel-preview/public#' .env
          sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=file/' .env
          sed -i 's/^CACHE_STORE=.*/CACHE_STORE=file/' .env
          sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=/' .env
          php artisan config:clear
          php artisan route:list
          test -d storage/framework
          test -d bootstrap/cache

      - name: Protect Laravel project files outside public directory
        run: |
          cat > laravel-preview/.htaccess <<'HTACCESS'
          Options -Indexes
          <IfModule mod_authz_core.c>
              Require all denied
          </IfModule>
          <IfModule !mod_authz_core.c>
              Order allow,deny
              Deny from all
          </IfModule>
          HTACCESS
          cat >> laravel-preview/public/.htaccess <<'HTACCESS'

          <IfModule mod_authz_core.c>
              Require all granted
          </IfModule>
          <IfModule !mod_authz_core.c>
              Order allow,deny
              Allow from all
          </IfModule>
          HTACCESS

      - name: Verify PHP ZipArchive and Laravel package
        run: |
          set -euo pipefail
          php -r 'if (!class_exists("ZipArchive")) { fwrite(STDERR, "ZipArchive missing\n"); exit(1); }'
          test -f laravel-preview/public/index.php
          test -f laravel-preview/vendor/autoload.php
          test -f laravel-preview/.env
          php -l laravel-preview/public/index.php

      - name: Package Laravel as one compressed archive
        run: |
          set -euo pipefail
          mkdir -p dist
          cd laravel-preview
          zip -qr ../dist/laravel-preview.zip . -x '*/tests/*' '*/.git/*' '*/.github/*' '*/README.md'
          cd ..
          ls -lh dist/laravel-preview.zip
          sha256sum dist/laravel-preview.zip

      - name: Create one-time protected extraction endpoint
        env:
          DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="$(php -r 'echo bin2hex(random_bytes(32));')"
          echo "::add-mask::$TOKEN"
          echo "LARAVEL_EXTRACT_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          mkdir -p dist
          cat > dist/.deploy-extract.php <<'PHP'
          <?php
          declare(strict_types=1);
          header('Content-Type: text/plain; charset=utf-8');
          $expected = '__TOKEN__';
          $provided = (string)($_POST['token'] ?? '');
          if (!hash_equals($expected, $provided)) {
              http_response_code(403);
              exit("Forbidden\n");
          }
          if (!class_exists(ZipArchive::class)) {
              http_response_code(500);
              exit("ZipArchive unavailable\n");
          }
          $archive = __DIR__ . '/laravel-preview.zip';
          $zip = new ZipArchive();
          if ($zip->open($archive) !== true) {
              http_response_code(500);
              exit("Archive unavailable\n");
          }
          $root = realpath(__DIR__);
          for ($i = 0; $i < $zip->numFiles; $i++) {
              $name = $zip->getNameIndex($i);
              if ($name === false || str_starts_with($name, '/') || preg_match('~(^|/)\.\.(?:/|$)~', $name)) {
                  $zip->close();
                  http_response_code(400);
                  exit("Unsafe archive path\n");
              }
          }
          $ok = $zip->extractTo(__DIR__);
          $zip->close();
          if (!$ok || !is_file(__DIR__ . '/public/index.php') || !is_file(__DIR__ . '/vendor/autoload.php')) {
              http_response_code(500);
              exit("Extraction verification failed\n");
          }
          @unlink($archive);
          @unlink(__FILE__);
          echo "Laravel preview extracted and verified.\n";
          PHP
          python3 - <<'PY'
          import os
          p = "dist/.deploy-extract.php"
          s = open(p, encoding="utf-8").read()
          s = s.replace("__TOKEN__", os.environ["LARAVEL_EXTRACT_TOKEN"])
          open(p, "w", encoding="utf-8").write(s)
          PY
          php -l dist/.deploy-extract.php

      - name: Upload compressed archive and one-time extractor
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BYETHOST_FTP_SERVER }}
          username: ${{ secrets.BYETHOST_FTP_USERNAME }}
          password: ${{ secrets.BYETHOST_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /htdocs/laravel-preview/
          local-dir: ./dist/
          dangerous-clean-slate: false

      - name: Extract archive on ByetHost and remove temporary endpoint
        env:
          EXTRACT_TOKEN: ${{ env.LARAVEL_EXTRACT_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 240 \
            --request POST \
            --data-urlencode "token=$EXTRACT_TOKEN" \
            "https://siakadstitdit.byethost24.com/laravel-preview/.deploy-extract.php"
          echo "Laravel archive extraction completed."

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "## Laravel preview deployment"
            echo "- Target: /htdocs/laravel-preview/"
            echo "- Transfer method: one ZIP archive, server-side extraction"
            echo "- Temporary extraction endpoint removes itself after success"
            echo "- Production website root and database were not changed"
          } >> "$GITHUB_STEP_SUMMARY"
