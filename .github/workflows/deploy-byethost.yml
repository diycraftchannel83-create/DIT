name: Deploy DIT to ByetHost

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Upload website to ByetHost
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Laravel hosting preflight in public test folder
        run: |
          set -euo pipefail
          mkdir -p ./laravel-test
          if [ -f ./laravel-app/public/preflight.php ]; then
            cp ./laravel-app/public/preflight.php ./laravel-test/preflight.php
          else
            echo "::warning::laravel-app/public/preflight.php belum tersedia; melewati file preflight."
          fi

      - name: Deploy web files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BYETHOST_FTP_SERVER }}
          username: ${{ secrets.BYETHOST_FTP_USERNAME }}
          password: ${{ secrets.BYETHOST_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /htdocs/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            app/**
            laravel-app/**
            gradle/**
            **/*.gradle
            **/*.gradle.kts
            gradlew
            gradlew.bat
            README.md
            docs/**
            **/database.local.php
            **/.env
            **/.env.*
            website/cek-konfigurasi.php
            website/cek-db.php
            website/tes-query.php
            website/debug-index.php
            website/debug.php
            website/buat-hash.php
            website/debug-*.php
